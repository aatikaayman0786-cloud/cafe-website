<!DOCTYPE html>
<html>

<head>

    <title>Reservation - Cafe Bliss</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-container">

    <h1>Book a Table 🍽️</h1>


    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <p class="message">
                {{ message }}
            </p>

        {% endfor %}

    {% endwith %}


    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Your Name"
               required>

        <input type="tel"
               name="phone"
               placeholder="Phone Number"
               required>

        <input type="date"
               name="date"
               required>

        <input type="time"
               name="time"
               required>

        <input type="number"
               name="people"
               placeholder="Number of People"
               min="1"
               required>

        <button type="submit">
            Reserve Table
        </button>

    </form>

</div>

</body>

</html>
